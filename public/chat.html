<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Connect Chat</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f4f8;
            text-align: center;
            padding: 30px;
        }
        .chat-box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 12px;
        }
        #messages {
            height: 250px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-box">
        <h2>Secure Connect Chat</h2>
        <div id="messages"></div>
        <input id="username" placeholder="Enter username">
        <input id="message" placeholder="Enter message">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const room = "lab4-room";

        socket.on("connect", () => {
            socket.emit("joinRoom", room);
        });

        function sendMessage() {
            const username = document.getElementById("username").value;
            const message = document.getElementById("message").value;

            if (!username || !message) {
                alert("Enter username and message");
                return;
            }

            socket.emit("chatMessage", {
                username,
                message,
                room
            });

            document.getElementById("message").value = "";
        }

        socket.on("chatMessage", (data) => {
            const p = document.createElement("p");
            p.textContent = data.username + ": " + data.message;
            document.getElementById("messages").appendChild(p);
        });
    </script>
</body>
</html>
